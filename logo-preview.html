<!DOCTYPE html>

    .login { color: #1A5276; text-decoration: none; font-size: 14px; }
    .size-38 { height: 38px; width: auto; }
    .size-52 { height: 52px; width: auto; }
    .size-64 { height: 64px; width: auto; }
    .size-80 { height: 80px; width: auto; }
    .note { font-size: 12px; color: #999; margin-top: 6px; }
